server:
  port: 9200
  mode: debug  # debug | release

database:
  host: 127.0.0.1
  port: 3306
  user: root
  password: root
  dbname: orion_visor
  charset: utf8mb4

redis:
  host: 127.0.0.1
  port: 6379
  password: ""
  db: 0

jwt:
  secret: orion-visor-secret-key
  expire: 24h

ssh:
  connect_timeout: 10s

monitor:
  # SSH real-time metrics collection interval
  interval: 3s
  # Keep metrics in memory for rolling chart (seconds)
  retain: 300

# Apache Guacamole 守护进程 (用于 RDP/VNC 远程桌面)
guacd:
  host: 127.0.0.1
  port: 4822
